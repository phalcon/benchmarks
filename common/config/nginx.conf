user www-data;
daemon off;
pid /run/nginx.pid;
# One worker for the one server vCPU. "auto" counts all the CPUs of the host,
# not the CPU set of the container.
worker_processes 1;
error_log stderr error;
worker_rlimit_nofile 200000;

events {
    worker_connections 16384;
    multi_accept off;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log off;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_disable none;
    keepalive_requests 10000;

    # FastCGI settings
    fastcgi_buffers 256 16k;
    fastcgi_buffer_size 128k;
    fastcgi_connect_timeout 30s;
    fastcgi_send_timeout 60s;
    fastcgi_read_timeout 60s;
    fastcgi_busy_buffers_size 256k;
    fastcgi_temp_file_write_size 256k;
    reset_timedout_connection on;
    server_names_hash_bucket_size 100;

    # No FastCGI keep-alive. A php-fpm worker that holds an open connection
    # takes no new connection. With a small php-fpm pool, the open connections
    # block the other requests.
    upstream fastcgi_backend {
        server unix:/run/php/php-fpm.sock;
    }

    server {
        listen       8080;
        server_name  localhost;

        root /app/public/;
        index  index.php;

        location / {
            fastcgi_pass   fastcgi_backend;
            fastcgi_param  SCRIPT_FILENAME    $document_root/index.php;
            fastcgi_param  PATH_INFO          $uri;
            include        /etc/nginx/fastcgi_params;
        }
    }
}
