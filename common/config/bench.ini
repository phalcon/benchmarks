; Settings for all frameworks and all variants (D7, D16).
opcache.enable=1
opcache.validate_timestamps=0
opcache.enable_file_override=1
opcache.jit=disable
realpath_cache_ttl=600
mysqlnd.collect_statistics=Off
expose_php=Off
cgi.fix_pathinfo=0
date.timezone=UTC
zend.assertions=-1
display_errors=Off
sys_temp_dir=/var/lib/bench/tmp
upload_tmp_dir=/var/lib/bench/tmp
