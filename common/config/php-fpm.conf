[global]
error_log = /proc/self/fd/2
pid = /run/php/php-fpm.pid

[bench]
user = www-data
group = www-data
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 65535
pm = static
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
